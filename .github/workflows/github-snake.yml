name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ahmadzulfiqar001
          outputs: |
            dist/github-snake.svg?color_snake=%23b33939&color_dots=%23181818,%233a1a1a,%235c1a1a,%23800000,%23a83232
            dist/github-snake-dark.svg?color_snake=%23b33939&color_dots=%23181818,%233a1a1a,%235c1a1a,%23800000,%23a83232
            dist/github-snake-light.svg?color_snake=%23800000&color_dots=%23f5efef,%23e0b8b8,%23cc8888,%23a83232,%23800000

      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
