<svg width="320" height="480" viewBox="0 0 320 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff2fb0"/>
    <stop offset="100%" stop-color="#c86dfa"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2d1150"/>
  </linearGradient>
  <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="avatarRing" cx="50%" cy="50%" r="50%">
    <stop offset="80%" stop-color="#ff6ec7" stop-opacity="0"/>
    <stop offset="92%" stop-color="#ff6ec7" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="cardClip"><rect x="-85" y="-4" width="170" height="230" rx="16"/></clipPath>

  <style>
    .rig { animation: dropIn .9s cubic-bezier(.2,.9,.3,1.1) forwards, swing 4.5s ease-in-out 0.9s infinite; transform-origin: 160px 40px; }
    @keyframes dropIn { from { transform: translateY(-260px) rotate(0deg); opacity:0; } to { transform: translateY(0) rotate(0deg); opacity:1; } }
    @keyframes swing {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(6deg); }
      50%  { transform: rotate(0deg); }
      75%  { transform: rotate(-6deg); }
      100% { transform: rotate(0deg); }
    }
    .shineSweep { animation: shineMove 3.2s ease-in-out infinite; }
    @keyframes shineMove { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(260px); } }
    .ringPulse { animation: ringGlow 2.6s ease-in-out infinite; }
    @keyframes ringGlow { 0%,100% { opacity:.6; } 50% { opacity:1; } }
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Courier New', ui-monospace, monospace; }
  </style>
</defs>

<!-- static strap anchor points -->
<circle cx="140" cy="8" r="4" fill="#5a2e8a"/>
<circle cx="180" cy="8" r="4" fill="#5a2e8a"/>

<g class="rig">
  <!-- strap -->
  <path d="M140,8 C120,90 130,150 155,190 L165,190 C150,150 142,90 158,10 Z" fill="url(#strapGrad)"/>
  <path d="M180,8 C200,90 190,150 165,190 L155,190 C170,150 178,90 162,10 Z" fill="url(#strapGrad)" opacity="0.85"/>
  <text x="160" y="70" text-anchor="middle" font-size="9" fill="#ffffff" opacity="0.85" class="mono" transform="rotate(4 160 70)">AHMADZULFIQAR001</text>
  <text x="160" y="130" text-anchor="middle" font-size="9" fill="#ffffff" opacity="0.85" class="mono" transform="rotate(-3 160 130)">DEVELOPER · BUILD MODE</text>

  <!-- metal clasp + ring -->
  <rect x="148" y="186" width="24" height="14" rx="4" fill="#b9bfc9" stroke="#7c828c" stroke-width="1.5"/>
  <circle cx="160" cy="206" r="9" fill="none" stroke="#b9bfc9" stroke-width="4"/>

  <!-- card -->
  <g transform="translate(160,240)">
    <rect x="-90" y="-6" width="180" height="240" rx="18" fill="url(#cardGrad)" stroke="#7b2ff7" stroke-opacity="0.5"/>
    <rect x="-90" y="-6" width="180" height="240" rx="18" fill="none" stroke="#ff6ec7" stroke-opacity="0.25"/>

    <g clip-path="url(#cardClip)">
      <rect class="shineSweep" x="-200" y="-10" width="60" height="250" fill="url(#shine)" transform="skewX(-18)"/>
    </g>

    <text x="0" y="26" text-anchor="middle" font-size="10" letter-spacing="3" fill="#c9b6ea" class="mono">GITHUB ID</text>

    <!-- avatar -->
    <circle class="ringPulse" cx="0" cy="70" r="42" fill="none" stroke="url(#avatarRing)" stroke-width="4"/>
    <circle cx="0" cy="70" r="34" fill="#3a1a5c"/>
    <text x="0" y="80" text-anchor="middle" font-size="30" font-weight="700" fill="#ff9fdb">AZ</text>

    <text x="0" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Ahmad Zulfiqar</text>
    <text x="0" y="153" text-anchor="middle" font-size="11" fill="#c9b6ea" class="mono">AI/ML · Full-Stack Dev</text>
    <text x="0" y="172" text-anchor="middle" font-size="11" fill="#ff8fd6" class="mono">@ahmadzulfiqar001</text>

    <!-- barcode -->
    <g transform="translate(-60,190)" fill="#e9d8ff">
      <rect x="0"  width="2" height="26"/><rect x="4"  width="1" height="26"/><rect x="7"  width="3" height="26"/>
      <rect x="12" width="1" height="26"/><rect x="15" width="2" height="26"/><rect x="19" width="1" height="26"/>
      <rect x="22" width="4" height="26"/><rect x="28" width="1" height="26"/><rect x="31" width="2" height="26"/>
      <rect x="35" width="1" height="26"/><rect x="38" width="3" height="26"/><rect x="43" width="1" height="26"/>
      <rect x="46" width="2" height="26"/><rect x="50" width="1" height="26"/><rect x="53" width="4" height="26"/>
      <rect x="59" width="1" height="26"/><rect x="62" width="2" height="26"/><rect x="66" width="1" height="26"/>
      <rect x="69" width="3" height="26"/><rect x="74" width="1" height="26"/><rect x="77" width="2" height="26"/>
      <rect x="81" width="1" height="26"/><rect x="84" width="3" height="26"/><rect x="89" width="1" height="26"/>
      <rect x="92" width="2" height="26"/><rect x="96" width="1" height="26"/><rect x="99" width="4" height="26"/>
      <rect x="105" width="1" height="26"/><rect x="108" width="2" height="26"/><rect x="112" width="3" height="26"/>
      <rect x="117" width="1" height="26"/>
    </g>
  </g>
</g>
</svg>
