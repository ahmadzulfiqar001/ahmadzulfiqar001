<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2d1150"/>
  </linearGradient>
  <linearGradient id="sAccent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#7b2ff7"/>
  </linearGradient>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Courier New', ui-monospace, monospace; }
    .row { opacity:0; animation: slideIn .6s ease forwards; }
    @keyframes slideIn { from { opacity:0; transform: translateX(-16px);} to { opacity:1; transform: translateX(0);} }
    .bar { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { from { transform: scaleX(0);} to { transform: scaleX(1);} }
    .ring { animation: ringIn 1.6s ease forwards; }
    @keyframes ringIn { from { stroke-dashoffset: 251; } to { stroke-dashoffset: 55; } }
  </style>
</defs>
<rect width="480" height="220" rx="16" fill="url(#sBg)" stroke="#7b2ff7" stroke-opacity="0.35"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#ffffff">Ahmad's GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(90,132)">
  <circle r="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
  <circle class="ring" r="46" fill="none" stroke="url(#sAccent)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="289" transform="rotate(-90)"/>
  <text text-anchor="middle" y="-2" font-size="22" font-weight="700" fill="#ffffff">A+</text>
  <text text-anchor="middle" y="16" font-size="10" fill="#c9b6ea" class="mono">RANK</text>
</g>

<!-- stat rows -->
<g transform="translate(190,60)" font-size="12" fill="#e9d8ff" class="mono">
  <g class="row" style="animation-delay:.1s">
    <text x="0" y="10">Total Stars Earned</text>
    <text x="270" y="10" text-anchor="end" fill="#ffd166">42</text>
    <rect x="0" y="18" width="270" height="6" rx="3" fill="#ffffff" opacity="0.08"/>
    <rect class="bar" x="0" y="18" width="150" height="6" rx="3" fill="url(#sAccent)" style="transform-origin:0 21px; animation-delay:.3s"/>
  </g>
  <g class="row" style="animation-delay:.3s">
    <text x="0" y="46">Total Commits</text>
    <text x="270" y="46" text-anchor="end" fill="#ffd166">1,180</text>
    <rect x="0" y="54" width="270" height="6" rx="3" fill="#ffffff" opacity="0.08"/>
    <rect class="bar" x="0" y="54" width="230" height="6" rx="3" fill="url(#sAccent)" style="transform-origin:0 57px; animation-delay:.5s"/>
  </g>
  <g class="row" style="animation-delay:.5s">
    <text x="0" y="82">Total PRs</text>
    <text x="270" y="82" text-anchor="end" fill="#ffd166">27</text>
    <rect x="0" y="90" width="270" height="6" rx="3" fill="#ffffff" opacity="0.08"/>
    <rect class="bar" x="0" y="90" width="90" height="6" rx="3" fill="url(#sAccent)" style="transform-origin:0 93px; animation-delay:.7s"/>
  </g>
  <g class="row" style="animation-delay:.7s">
    <text x="0" y="118">Contributed To</text>
    <text x="270" y="118" text-anchor="end" fill="#ffd166">9 repos</text>
    <rect x="0" y="126" width="270" height="6" rx="3" fill="#ffffff" opacity="0.08"/>
    <rect class="bar" x="0" y="126" width="110" height="6" rx="3" fill="url(#sAccent)" style="transform-origin:0 129px; animation-delay:.9s"/>
  </g>
</g>
</svg>
