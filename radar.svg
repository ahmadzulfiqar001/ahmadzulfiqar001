<svg width="440" height="320" viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#181818"/>
    <stop offset="100%" stop-color="#241212"/>
  </linearGradient>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Courier New', ui-monospace, monospace; }
    .dataPoly {
      stroke-dasharray: 620;
      stroke-dashoffset: 620;
      animation: draw 1.8s ease forwards, fillIn 1.8s ease forwards;
      animation-delay: .2s;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fillIn { from { fill-opacity: 0; } to { fill-opacity: 0.35; } }
    .dot { opacity: 0; animation: dotIn .4s ease forwards; }
    @keyframes dotIn { to { opacity: 1; } }
    .lbl { opacity: 0; animation: lblIn .6s ease forwards; }
    @keyframes lblIn { to { opacity: 1; } }
  </style>
</defs>

<rect width="440" height="320" rx="16" fill="url(#rBg)" stroke="#800000" stroke-opacity="0.35"/>
<text x="24" y="30" font-size="15" font-weight="700" fill="#ffffff">Skills Radar</text>

<g>
