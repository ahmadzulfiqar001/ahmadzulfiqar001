  <line x1="215" y1="165" x2="301.6" y2="115.0" stroke="#3a1a1a" stroke-width="1"/>
  <line x1="215" y1="165" x2="301.6" y2="215.0" stroke="#3a1a1a" stroke-width="1"/>
