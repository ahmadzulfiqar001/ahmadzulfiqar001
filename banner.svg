<svg width="1280" height="740" viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="roundedFrame"><rect x="0" y="0" width="1280" height="740" rx="26"/></clipPath>
  <clipPath id="scanClip"><rect x="0" y="0" width="1280" height="740" rx="26"/></clipPath>

  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="45%" stop-color="#2d1150"/>
    <stop offset="100%" stop-color="#3a0f3d"/>
  </linearGradient>

  <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff2fb0" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ff2fb0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="50%" stop-color="#c86dfa"/>
    <stop offset="100%" stop-color="#7b2ff7"/>
    <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff2fb0" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0.18"/>
  </linearGradient>

  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0"/>
    <stop offset="45%" stop-color="#ff6ec7" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#7b2ff7" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
  </linearGradient>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Courier New', ui-monospace, monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }

    .typeline1 { animation: reveal 2.2s steps(40,end) forwards; }
    .typeline2 { animation: reveal 2.6s steps(46,end) forwards; animation-delay: .2s; opacity:0; animation-fill-mode: forwards; }
    @keyframes reveal { from { clip-path: inset(0 100% 0 0);} to { clip-path: inset(0 0 0 0);} }

    .letter { opacity: 0; animation: popin .5s ease forwards; }
    @keyframes popin { from{opacity:0; transform: translateY(10px);} to{opacity:1; transform: translateY(0);} }

    .role { opacity: 0; animation: roleCarousel 9s ease infinite; }
    @keyframes roleCarousel {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      28%  { opacity: 1; }
      33%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .pill { opacity: 0; animation: fadeUp .6s ease forwards; }
    .pill:hover rect { filter: brightness(1.3); }
    @keyframes fadeUp { from{opacity:0; transform: translateY(8px);} to{opacity:1; transform: translateY(0);} }

    .barFill { animation: growBar 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .codeline { animation: reveal 1.4s steps(40,end) forwards; opacity: 0; animation-fill-mode: forwards; }

    .neon { animation: flicker 5s infinite; }
    @keyframes flicker {
      0%,3%,5%,7%,20%,100% { opacity: 1; filter: drop-shadow(0 0 8px #ff2fb0) drop-shadow(0 0 18px #7b2ff7); }
      4%,6% { opacity: .25; filter: none; }
    }

    .scanner { animation: sweep 3.5s linear infinite; }
    @keyframes sweep { from { transform: translateY(-100px);} to { transform: translateY(840px);} }

    .particle { animation: rise linear infinite; }
    @keyframes rise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: .9; }
      90% { opacity: .3; }
      100% { transform: translateY(-620px) translateX(20px); opacity: 0; }
    }

    .heart { animation: floatHeart ease-in-out infinite; }
    @keyframes floatHeart { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-14px);} }

    .sparkle { animation: twinkle ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.7);} 50% { opacity: 1; transform: scale(1.15);} }

    .orb { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }

    .stack-in { opacity: 0; animation: fadeUp .8s ease forwards; }
  </style>
</defs>

<g clip-path="url(#roundedFrame)">
  <rect width="1280" height="740" fill="url(#bgGrad)"/>
  <circle class="orb" cx="1080" cy="120" r="220" fill="url(#glowPink)"/>
  <circle class="orb" cx="150" cy="620" r="260" fill="url(#glowPurple)" style="animation-delay:1.5s"/>

  <!-- particles -->
  <g fill="#ff6ec7">
    <circle class="particle" cx="120" cy="700" r="2.5" style="animation-duration:7s; animation-delay:0s"/>
    <circle class="particle" cx="260" cy="720" r="2" style="animation-duration:9s; animation-delay:1s"/>
    <circle class="particle" cx="640" cy="710" r="2.2" style="animation-duration:8s; animation-delay:2.2s"/>
    <circle class="particle" cx="980" cy="700" r="2" style="animation-duration:6.5s; animation-delay:.6s"/>
    <circle class="particle" cx="1150" cy="715" r="2.4" style="animation-duration:10s; animation-delay:3s"/>
    <circle class="particle" cx="420" cy="705" r="2" style="animation-duration:7.5s; animation-delay:1.8s"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <circle class="sparkle" cx="1020" cy="60" r="2" style="animation-duration:3s; animation-delay:.2s"/>
    <circle class="sparkle" cx="1180" cy="140" r="1.6" style="animation-duration:2.4s; animation-delay:1s"/>
    <circle class="sparkle" cx="60" cy="90" r="1.8" style="animation-duration:2.8s; animation-delay:.6s"/>
    <circle class="sparkle" cx="90" cy="220" r="1.5" style="animation-duration:3.4s; animation-delay:1.4s"/>
  </g>

  <!-- floating hearts -->
  <g fill="#ff2fb0" opacity="0.85">
    <path class="heart" style="animation-duration:5s" transform="translate(1195,300) scale(0.7)" d="M12 21s-7.5-4.6-10-9.1C.5 8.6 2.4 5 6 5c2 0 3.4 1.1 4 2.1C10.6 6.1 12 5 14 5c3.6 0 5.5 3.6 4 6.9C19.5 16.4 12 21 12 21z"/>
    <path class="heart" style="animation-duration:6.5s; animation-delay:1s" transform="translate(1220,420) scale(0.5)" d="M12 21s-7.5-4.6-10-9.1C.5 8.6 2.4 5 6 5c2 0 3.4 1.1 4 2.1C10.6 6.1 12 5 14 5c3.6 0 5.5 3.6 4 6.9C19.5 16.4 12 21 12 21z"/>
  </g>

  <!-- terminal block -->
  <g transform="translate(48,44)">
    <rect x="0" y="0" width="430" height="30" rx="8" fill="#ffffff" opacity="0.06"/>
    <circle cx="14" cy="15" r="4.5" fill="#ff5f57"/>
    <circle cx="30" cy="15" r="4.5" fill="#febc2e"/>
    <circle cx="46" cy="15" r="4.5" fill="#28c840"/>
    <g class="mono typeline1" font-size="14" fill="#7effc0">
      <text x="14" y="55">user@dev:~$ cat README.md</text>
    </g>
    <rect x="228" y="42" width="8" height="16" fill="#7effc0" class="cursor"/>
  </g>

  <!-- name -->
  <g transform="translate(48,150)" font-size="58" font-weight="700" fill="url(#nameGrad)">
    <text class="letter" x="0"   y="0" style="animation-delay:.1s">A</text>
    <text class="letter" x="40"  y="0" style="animation-delay:.16s">h</text>
    <text class="letter" x="78"  y="0" style="animation-delay:.22s">m</text>
    <text class="letter" x="132" y="0" style="animation-delay:.28s">a</text>
    <text class="letter" x="170" y="0" style="animation-delay:.34s">d</text>
    <text class="letter" x="228" y="0" style="animation-delay:.42s">Z</text>
    <text class="letter" x="266" y="0" style="animation-delay:.48s">u</text>
    <text class="letter" x="304" y="0" style="animation-delay:.54s">l</text>
    <text class="letter" x="322" y="0" style="animation-delay:.60s">f</text>
    <text class="letter" x="346" y="0" style="animation-delay:.66s">i</text>
    <text class="letter" x="362" y="0" style="animation-delay:.72s">q</text>
    <text class="letter" x="400" y="0" style="animation-delay:.78s">a</text>
    <text class="letter" x="438" y="0" style="animation-delay:.84s">r</text>
  </g>

  <!-- cycling roles -->
  <g transform="translate(50,196)" font-size="24" font-weight="500" fill="#e9d8ff" class="mono">
    <text class="role" style="animation-delay:0s">&gt; AI &amp; ML Engineer</text>
    <text class="role" style="animation-delay:3s">&gt; Full-Stack Developer</text>
    <text class="role" style="animation-delay:6s">&gt; Generative AI Enthusiast</text>
  </g>

  <!-- tagline quote box -->
  <g transform="translate(48,232)">
    <rect x="0" y="0" width="560" height="52" rx="10" fill="#ffffff" opacity="0.05" stroke="#ff6ec7" stroke-opacity="0.35"/>
    <text class="mono typeline2" x="16" y="32" font-size="15" fill="#ffd9f0">"Turning data into decisions, and code into solutions."</text>
  </g>

  <!-- about lines -->
  <g transform="translate(48,318)" font-size="14.5" fill="#c9b6ea" class="stack-in" style="animation-delay:1.4s">
    <text y="0">CS undergrad at COMSATS University Islamabad, building with AI, ML &amp; the MERN stack.</text>
    <text y="24">Winner - CS50x Harvard Puzzle Day. Always shipping something new.</text>
  </g>

  <!-- tech pills -->
  <g transform="translate(48,362)" font-size="13" font-family="Courier New, monospace" font-weight="600">
    <g class="pill" style="animation-delay:1.6s"><rect width="70" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="35" y="18" text-anchor="middle" fill="#ffe1f4">Python</text></g>
    <g class="pill" transform="translate(78,0)" style="animation-delay:1.7s"><rect width="90" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="45" y="18" text-anchor="middle" fill="#ffe1f4">JavaScript</text></g>
    <g class="pill" transform="translate(176,0)" style="animation-delay:1.8s"><rect width="66" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="33" y="18" text-anchor="middle" fill="#ffe1f4">React</text></g>
    <g class="pill" transform="translate(250,0)" style="animation-delay:1.9s"><rect width="80" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="40" y="18" text-anchor="middle" fill="#ffe1f4">Node.js</text></g>
    <g class="pill" transform="translate(338,0)" style="animation-delay:2.0s"><rect width="88" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="44" y="18" text-anchor="middle" fill="#ffe1f4">FastAPI</text></g>
    <g class="pill" transform="translate(434,0)" style="animation-delay:2.1s"><rect width="98" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="49" y="18" text-anchor="middle" fill="#ffe1f4">MongoDB</text></g>
    <g class="pill" transform="translate(0,38)" style="animation-delay:2.2s"><rect width="108" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="54" y="18" text-anchor="middle" fill="#ffe1f4">TensorFlow</text></g>
    <g class="pill" transform="translate(116,38)" style="animation-delay:2.3s"><rect width="80" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="40" y="18" text-anchor="middle" fill="#ffe1f4">Flutter</text></g>
    <g class="pill" transform="translate(204,38)" style="animation-delay:2.4s"><rect width="60" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="30" y="18" text-anchor="middle" fill="#ffe1f4">C++</text></g>
    <g class="pill" transform="translate(272,38)" style="animation-delay:2.5s"><rect width="58" height="28" rx="14" fill="url(#pillGrad)" stroke="#ff6ec7" stroke-opacity="0.5"/><text x="29" y="18" text-anchor="middle" fill="#ffe1f4">PHP</text></g>
  </g>

  <!-- stats bar -->
  <g transform="translate(48,452)" class="stack-in" style="animation-delay:2s">
    <text font-size="13" fill="#c9b6ea" class="mono" y="-8">contribution_focus.chart()</text>
    <g font-size="12" fill="#e9d8ff" class="mono">
      <text x="0" y="20">Machine Learning</text>
      <rect x="0" y="28" width="220" height="7" rx="3.5" fill="#ffffff" opacity="0.08"/>
      <rect x="0" y="28" width="185" height="7" rx="3.5" fill="url(#nameGrad)" class="barFill" style="transform-origin:0px 31.5px; animation-delay:2.1s"/>

      <text x="240" y="20">Full-Stack Dev</text>
      <rect x="240" y="28" width="220" height="7" rx="3.5" fill="#ffffff" opacity="0.08"/>
      <rect x="240" y="28" width="165" height="7" rx="3.5" fill="url(#nameGrad)" class="barFill" style="transform-origin:240px 31.5px; animation-delay:2.25s"/>

      <text x="480" y="20">Generative AI</text>
      <rect x="480" y="28" width="220" height="7" rx="3.5" fill="#ffffff" opacity="0.08"/>
      <rect x="480" y="28" width="145" height="7" rx="3.5" fill="url(#nameGrad)" class="barFill" style="transform-origin:480px 31.5px; animation-delay:2.4s"/>
    </g>
  </g>

  <!-- code editor card -->
  <g transform="translate(700,44)">
    <rect width="530" height="300" rx="14" fill="#150826" stroke="#7b2ff7" stroke-opacity="0.4"/>
    <rect width="530" height="34" rx="14" fill="#1f0d38"/>
    <circle cx="20" cy="17" r="4.5" fill="#ff5f57"/>
    <circle cx="36" cy="17" r="4.5" fill="#febc2e"/>
    <circle cx="52" cy="17" r="4.5" fill="#28c840"/>
    <text x="70" y="22" font-size="12" fill="#c9b6ea" class="mono">buildDreams.jsx</text>

    <g class="mono" font-size="14" fill="#e9d8ff">
      <text class="codeline" x="20" y="66"  style="animation-delay:.3s"  fill="#ff8fd6">function <tspan fill="#7effc0">buildDreams</tspan>() {</text>
      <text class="codeline" x="40" y="94"  style="animation-delay:.9s">const skills = [</text>
      <text class="codeline" x="60" y="120" style="animation-delay:1.4s">"AI", "ML", "MERN", "GenAI"</text>
      <text class="codeline" x="40" y="146" style="animation-delay:1.9s">];</text>
      <text class="codeline" x="40" y="176" style="animation-delay:2.4s">while (<tspan fill="#7effc0">alive</tspan>) {</text>
      <text class="codeline" x="60" y="202" style="animation-delay:2.9s">learn(); build(); ship();</text>
      <text class="codeline" x="40" y="228" style="animation-delay:3.4s">}</text>
      <text class="codeline" x="20" y="254" style="animation-delay:3.9s">return <tspan fill="#ffd166">"impact"</tspan>;</text>
      <text class="codeline" x="20" y="280" style="animation-delay:4.4s" fill="#ff8fd6">}</text>
    </g>
  </g>

  <!-- neon sign -->
  <g transform="translate(700,392)" text-anchor="middle" font-size="22" font-weight="700" class="mono">
    <text class="neon" x="265" y="0" fill="#ff2fb0">KEEP CODING</text>
    <text class="neon" x="265" y="34" fill="#7b2ff7" style="animation-delay:.3s">KEEP GROWING</text>
  </g>

  <!-- scanner sweep -->
  <g clip-path="url(#scanClip)">
    <rect class="scanner" x="0" y="-100" width="1280" height="100" fill="url(#scanGrad)"/>
  </g>

  <rect x="1" y="1" width="1278" height="738" rx="25" fill="none" stroke="#ff6ec7" stroke-opacity="0.25"/>
</g>
</svg>
