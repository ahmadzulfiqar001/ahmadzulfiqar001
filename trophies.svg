<svg width="980" height="180" viewBox="0 0 980 180" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2d1150"/>
  </linearGradient>
  <linearGradient id="tGold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffe08a"/>
    <stop offset="100%" stop-color="#e0a527"/>
  </linearGradient>
  <clipPath id="tClip"><rect width="980" height="180" rx="16"/></clipPath>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Courier New', ui-monospace, monospace; }
    .cell { opacity:0; animation: popIn .55s ease forwards; }
    @keyframes popIn { from { opacity:0; } to { opacity:1; } }
    .shine { animation: shineMove 3.6s ease-in-out infinite; }
    @keyframes shineMove { 0% { transform: translateX(-140px);} 60%,100% { transform: translateX(980px);} }
    .glow { animation: glowPulse 2.4s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { opacity:.5;} 50% { opacity:1;} }
    .bar { animation: barGrow 1.2s ease forwards; }
    @keyframes barGrow { from { transform: scaleX(0);} to { transform: scaleX(1);} }
  </style>
</defs>
<g clip-path="url(#tClip)">
<rect width="980" height="180" fill="url(#tBg)"/>

<g transform="translate(0,10)">
  <g class="cell" transform="translate(15,0)" style="animation-delay:.05s">
    <rect width="150" height="150" rx="14" fill="#ffffff" opacity="0.04" stroke="#7b2ff7" stroke-opacity="0.4"/>
    <text x="130" y="24" text-anchor="end" font-size="13" font-weight="800" fill="#ff2fb0">SSS</text>
    <circle class="glow" cx="75" cy="52" r="24" fill="url(#tGold)" opacity="0.9"/>
    <text x="75" y="60" text-anchor="middle" font-size="24">🏆</text>
    <text x="75" y="96" text-anchor="middle" font-size="11" fill="#e9d8ff" font-weight="700">Puzzle Master</text>
    <text x="75" y="113" text-anchor="middle" font-size="9" fill="#c9b6ea" class="mono">CS50x Harvard</text>
    <rect x="20" y="128" width="110" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
    <rect x="20" y="128" width="110" height="4" rx="2" fill="#ff2fb0" class="bar" style="transform-origin:20px 130px; animation-delay:.3s"/>
  </g>
  <g class="cell" transform="translate(175,0)" style="animation-delay:.15s">
    <rect width="150" height="150" rx="14" fill="#ffffff" opacity="0.04" stroke="#7b2ff7" stroke-opacity="0.4"/>
    <text x="130" y="24" text-anchor="end" font-size="13" font-weight="800" fill="#ffd166">S</text>
    <circle class="glow" cx="75" cy="52" r="24" fill="url(#tGold)" opacity="0.85"/>
    <text x="75" y="60" text-anchor="middle" font-size="24">🧠</text>
    <text x="75" y="96" text-anchor="middle" font-size="11" fill="#e9d8ff" font-weight="700">AI Builder</text>
    <text x="75" y="113" text-anchor="middle" font-size="9" fill="#c9b6ea" class="mono">7+ ML/AI apps</text>
    <rect x="20" y="128" width="110" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
    <rect x="20" y="128" width="98" height="4" rx="2" fill="#ffd166" class="bar" style="transform-origin:20px 130px; animation-delay:.4s"/>
  </g>
  <g class="cell" transform="translate(335,0)" style="animation-delay:.25s">
    <rect width="150" height="150" rx="14" fill="#ffffff" opacity="0.04" stroke="#7b2ff7" stroke-opacity="0.4"/>
    <text x="130" y="24" text-anchor="end" font-size="13" font-weight="800" fill="#c86dfa">A</text>
    <circle class="glow" cx="75" cy="52" r="24" fill="url(#tGold)" opacity="0.85"/>
    <text x="75" y="60" text-anchor="middle" font-size="24">🚀</text>
    <text x="75" y="96" text-anchor="middle" font-size="11" fill="#e9d8ff" font-weight="700">Full Stack</text>
    <text x="75" y="113" text-anchor="middle" font-size="9" fill="#c9b6ea" class="mono">14+ projects</text>
    <rect x="20" y="128" width="110" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
    <rect x="20" y="128" width="88" height="4" rx="2" fill="#c86dfa" class="bar" style="transform-origin:20px 130px; animation-delay:.5s"/>
  </g>
  <g class="cell" transform="translate(495,0)" style="animation-delay:.35s">
    <rect width="150" height="150" rx="14" fill="#ffffff" opacity="0.04" stroke="#7b2ff7" stroke-opacity="0.4"/>
    <text x="130" y="24" text-anchor="end" font-size="13" font-weight="800" fill="#c86dfa">A</text>
    <circle class="glow" cx="75" cy="52" r="24" fill="url(#tGold)" opacity="0.85"/>
    <text x="75" y="60" text-anchor="middle" font-size="24">⚡</text>
    <text x="75" y="96" text-anchor="middle" font-size="11" fill="#e9d8ff" font-weight="700">Hackathon</text>
    <text x="75" y="113" text-anchor="middle" font-size="9" fill="#c9b6ea" class="mono">Web Mind '25</text>
    <rect x="20" y="128" width="110" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
    <rect x="20" y="128" width="80" height="4" rx="2" fill="#c86dfa" class="bar" style="transform-origin:20px 130px; animation-delay:.6s"/>
  </g>
  <g class="cell" transform="translate(655,0)" style="animation-delay:.45s">
    <rect width="150" height="150" rx="14" fill="#ffffff" opacity="0.04" stroke="#7b2ff7" stroke-opacity="0.4"/>
    <text x="130" y="24" text-anchor="end" font-size="13" font-weight="800" fill="#c86dfa">A</text>
    <circle class="glow" cx="75" cy="52" r="24" fill="url(#tGold)" opacity="0.85"/>
    <text x="75" y="60" text-anchor="middle" font-size="24">🛡️</text>
    <text x="75" y="96" text-anchor="middle" font-size="11" fill="#e9d8ff" font-weight="700">Federated ML</text>
    <text x="75" y="113" text-anchor="middle" font-size="9" fill="#c9b6ea" class="mono">~99% accuracy</text>
    <rect x="20" y="128" width="110" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
    <rect x="20" y="128" width="92" height="4" rx="2" fill="#c86dfa" class="bar" style="transform-origin:20px 130px; animation-delay:.7s"/>
  </g>
  <g class="cell" transform="translate(815,0)" style="animation-delay:.55s">
    <rect width="150" height="150" rx="14" fill="#ffffff" opacity="0.04" stroke="#7b2ff7" stroke-opacity="0.4"/>
    <text x="130" y="24" text-anchor="end" font-size="13" font-weight="800" fill="#7ee9a8">B</text>
    <circle class="glow" cx="75" cy="52" r="24" fill="url(#tGold)" opacity="0.85"/>
    <text x="75" y="60" text-anchor="middle" font-size="24">🔥</text>
    <text x="75" y="96" text-anchor="middle" font-size="11" fill="#e9d8ff" font-weight="700">Streak Keeper</text>
    <text x="75" y="113" text-anchor="middle" font-size="9" fill="#c9b6ea" class="mono">Since 2023</text>
    <rect x="20" y="128" width="110" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
    <rect x="20" y="128" width="66" height="4" rx="2" fill="#7ee9a8" class="bar" style="transform-origin:20px 130px; animation-delay:.8s"/>
  </g>
</g>

<rect class="shine" x="0" y="0" width="60" height="180" fill="#ffffff" opacity="0.05" transform="skewX(-18)"/>
</g>
</svg>
